<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سوانح</title>
<style>
:root{--navy:#172b4d;--blue:#2457a7;--tint:#edf3ff;--bg:#fafbfd;--text:#1f2937;--muted:#566176;--line:#d9e0eb;--white:#fff}
*{box-sizing:border-box}
html{scroll-padding-top:1rem}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.8 "Noto Naskh Arabic",Tahoma,"Segoe UI",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 1.25rem}
a{color:var(--blue)}
:focus-visible{outline:3px solid #82b1ff;outline-offset:3px;border-radius:4px}
.skip{position:absolute;inset-inline-start:1rem;top:-4rem;background:var(--white);padding:.5rem 1rem;z-index:10}
.skip:focus{top:1rem}

/* Hero */
.hero{background:var(--navy);color:var(--white);padding:3.5rem 0 3rem}
h1{font-size:clamp(1.9rem,6vw,2.75rem);line-height:1.3;margin:0 0 .5rem}
.subtitle{font-size:1.2rem;color:#c9d6ee;margin:0 0 1.25rem}
.intro{margin:0;color:#e6edf9;border-top:1px solid #3a5280;padding-top:1.25rem}

/* Table of contents */
.toc{background:var(--white);border-bottom:1px solid var(--line)}
.toc h2{font-size:1rem;margin:0;padding-top:1rem;color:var(--muted);font-weight:600}
.toc ol{list-style:none;margin:0;padding:.5rem 0 1rem;display:flex;flex-wrap:wrap;gap:.25rem 1.25rem}
.toc a{text-decoration:none;padding:.25rem 0;display:inline-block;border-bottom:2px solid transparent}
.toc a:hover{border-color:var(--blue)}

/* Sections */
main{padding:1rem 0 3rem}
.block{padding:2.25rem 0;border-bottom:1px solid var(--line)}
.block:last-child{border-bottom:0}
h2{font-size:1.5rem;line-height:1.4;color:var(--navy);margin:0 0 1rem;padding-inline-start:.75rem;border-inline-start:4px solid var(--blue)}
h3{font-size:1.1rem;margin:0 0 .25rem;color:var(--navy)}
.block p{margin:0 0 1rem}

/* Timeline */
.timeline{list-style:none;margin:0;padding:0}
.timeline time{display:block;font-weight:700;color:var(--blue);margin-bottom:.25rem}
.ev{position:relative;padding:0 0 1.75rem;padding-inline-start:1.5rem;border-inline-start:2px solid var(--line)}
.ev::before{content:"";position:absolute;inset-inline-start:-7px;top:.55rem;width:12px;height:12px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--bg)}
.ev p{margin:0;color:var(--muted)}
@media(min-width:640px){.timeline li{display:grid;grid-template-columns:7.5rem 1fr;gap:1.5rem}.timeline time{padding-top:.1rem}}

/* Quotes */
blockquote{margin:0 0 1.25rem;padding:1.25rem 1.5rem;background:var(--tint);border-inline-start:4px solid var(--blue);border-radius:8px;font-size:1.15rem}
blockquote p{margin:0 0 .5rem!important}
blockquote cite{display:block;font-size:.9rem;color:var(--muted);font-style:normal}

footer.site{border-top:1px solid var(--line);padding:1.5rem 0;color:var(--muted);font-size:.85rem;text-align:center}
</style>
</head>
<body>
<a class="skip" href="#main">مخکې پر منځپانګې ورځئ</a>

<header class="hero">
  <div class="wrap">
    <h1 id="title">…</h1>
    <p class="subtitle" id="subtitle"></p>
    <p class="intro" id="intro"></p>
  </div>
</header>

<nav class="toc" aria-label="فهرست">
  <div class="wrap"><h2>فهرست</h2><ol id="toc"></ol></div>
</nav>

<main id="main" class="wrap" tabindex="-1"><noscript><p>د دې پاڼې لپاره جاوا سکریپټ اړین دی.</p></noscript></main>

<footer class="site"><div class="wrap">د سوانحو مدیریت سیستم</div></footer>

<script>
// Sample data (used when the page is opened without the API).
const SAMPLE={
  title:"احمد ظاهر",subtitle:"د ژوند او کار لنډه کتنه",language:"ps",
  intro:"دا د سوانحو د نمونې پاڼه ده. دلته د یو شخص ژوند، زده کړې او دندې په ساده او منظم ډول ښودل کېږي.",
  sections:[
    {heading:"لومړنی ژوند",body:"احمد ظاهر په یوه کورنۍ کې زېږېدلی او لومړنۍ زده کړې یې په خپل ولایت کې بشپړې کړې.\n\nد ځوانۍ په کلونو کې یې د کتاب لوستلو او ټولنیزو کارونو ته ځانګړې پاملرنه درلودله."},
    {heading:"کاري تجربه",body:"هغه په بېلابېلو ادارو کې مسؤلیتونه سرته رسولي او د خپل کار په برخه کې یې ښه نوم ګټلی دی."}
  ],
  timeline:[
    {date_label:"۱۳۶۰",title:"زېږېدنه",description:"په یوه کلي کې زېږېدلی."},
    {date_label:"۱۳۷۸",title:"د لیسې فراغت",description:"د لیسې دوره یې په بریالیتوب سره پای ته ورسوله."},
    {date_label:"۱۳۸۳",title:"د پوهنتون پیل",description:"په پوهنتون کې یې لوړې زده کړې پیل کړې."},
    {date_label:"۱۳۸۹",title:"لومړۍ دنده",description:"په یوه دولتي اداره کې د کارپوه په توګه ګمارل شو."}
  ],
  quotes:[{text:"کار د انسان ښه پېژندګلوي ده.",attribution:"د نمونې وینا"}]
};

const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

function render(d){
  document.title=d.title+" | سوانح";
  document.documentElement.lang=d.language||"ps";
  $("#title").textContent=d.title;
  $("#subtitle").textContent=d.subtitle||"";
  $("#intro").textContent=d.intro||"";
  const main=$("#main"),toc=$("#toc");
  main.replaceChildren();toc.replaceChildren();
  const add=(id,heading,node)=>{
    const s=el("section","block");s.setAttribute("aria-labelledby",id+"-h");
    const h=el("h2",null,heading);h.id=id+"-h";s.id=id;s.append(h,node);main.append(s);
    const li=el("li"),a=el("a",null,heading);a.href="#"+id;li.append(a);toc.append(li);
  };
  (d.sections||[]).forEach((s,i)=>{
    const box=el("div");
    s.body.split(/\n{2,}/).forEach(p=>box.append(el("p",null,p)));
    add("s"+i,s.heading,box);
  });
  if((d.timeline||[]).length){
    const ol=el("ol","timeline");
    d.timeline.forEach(t=>{
      const li=el("li"),ev=el("div","ev");
      ev.append(el("h3",null,t.title),el("p",null,t.description));
      li.append(el("time",null,t.date_label),ev);ol.append(li);
    });
    add("timeline","د ژوند مهمې پیښې",ol);
  }
  if((d.quotes||[]).length){
    const box=el("div");
    d.quotes.forEach(q=>{
      const b=el("blockquote");b.append(el("p",null,q.text));
      if(q.attribution)b.append(el("cite",null,q.attribution));
      box.append(b);
    });
    add("quotes","ویناوې",box);
  }
}

(async()=>{
  const m=location.pathname.match(/^\/sawanih\/([\w-]+)/);
  let d=SAMPLE;
  if(m){
    try{
      const r=await fetch("/api/sawanih/"+m[1]);
      d=r.ok?await r.json():{title:"پاڼه ونه موندل شوه",sections:[],timeline:[],quotes:[]};
    }catch(e){}
  }
  render(d);
})();
</script>
</body>
</html>
