{% if page_obj.has_other_pages %}
<nav class="pager no-print" aria-label="مخونه">
  {% if page_obj.has_previous %}<a href="{% querystring page=page_obj.previous_page_number %}">‹ مخکنی</a>{% endif %}
  <span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="{% querystring page=page_obj.next_page_number %}">بل ›</a>{% endif %}
</nav>
{% endif %}
