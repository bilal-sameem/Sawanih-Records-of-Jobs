<dialog id="confirmDialog" aria-labelledby="dlgTitle">
  <h3 id="dlgTitle">ریکارډ ړنګول</h3>
  <p>آیا تاسو ډاډه یاست چې «<strong data-name></strong>» ړنګ کړئ؟ دا کار بیرته نشي کېدی.</p>
  <p class="dlg-err" data-err role="alert"></p>
  <div class="dlg-actions">
    <button type="button" class="btn danger solid" data-confirm>هو، ړنګ کړئ</button>
    <button type="button" class="btn" data-cancel>لغوه</button>
  </div>
</dialog>
